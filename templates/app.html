{% extends "base.html" %}
{% load static %}
{% block body %}
<header class="topbar">
  <strong class="brand">AskYourData</strong>
  <label class="client-pick">
    <span>Client</span>
    <select id="client"></select>
  </label>
  <form method="post" action="{% url 'logout' %}" class="who">
    {% csrf_token %}
    <span>{{ user.get_username }}</span>
    <button type="submit" class="link">Sign out</button>
  </form>
</header>

<div class="layout">
  <aside class="history">
    <h2>Recent</h2>
    <ul id="history"></ul>
  </aside>

  <main class="main">
    <section class="card">
      <label for="question" class="sr-only">Question</label>
      <textarea id="question" maxlength="500" rows="3"
        placeholder="Ask about this client's GA4 + Google Ads data…"></textarea>
      <div class="ask-row">
        <div class="chips" id="chips">
          <button type="button" class="chip">Top 5 campaigns by conversions last month</button>
          <button type="button" class="chip">Sessions by device last 30 days</button>
          <button type="button" class="chip">Ad cost per GA4 key event from paid Google, last 30 days</button>
        </div>
        <span id="count" class="muted small"></span>
        <button id="ask" class="btn">Ask <kbd>⌘↵</kbd></button>
      </div>
    </section>

    <section id="result" class="card" hidden>
      <div id="notice" class="notice" role="status" hidden></div>
      <p id="answer" class="answer" aria-live="polite"></p>
      <div id="chart-wrap" class="chart-wrap" hidden><canvas id="chart" aria-label="Result chart"></canvas></div>
      <details id="sql-box">
        <summary>Show SQL</summary>
        <pre id="sql"></pre>
        <button type="button" id="copy" class="link">Copy SQL</button>
      </details>
      <div class="table-wrap"><table id="table"></table></div>
      <div class="foot">
        <small id="meta" class="muted"></small>
        <span class="feedback" id="feedback">
          <button type="button" class="link" data-rating="1" aria-label="Good answer">👍</button>
          <button type="button" class="link" data-rating="-1" aria-label="Bad answer">👎</button>
        </span>
      </div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="{% static 'app.js' %}"></script>
{% endblock %}
